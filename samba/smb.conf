[global]
	workgroup = nsa210
        server string = NSA210
	netbios name = nsa210
	dos charset = UTF8
	display charset = UTF8
	unix charset = UTF8
	security = user
	encrypt passwords = yes
	smb passwd file = /etc/samba/smbpasswd
	guest account = pc-guest
	map to guest = Bad User
	write ok = yes
	force create mode = 777
	force directory mode = 777
	force security mode = 777
	force directory security mode = 777
	auth methods = guest sam_ignoredomain
	max log size = 50
	host msdfs = yes
	printing = cups
	printcap = /etc/printcap
	load printers = yes
	use sendfile = yes
	socket options = TCP_NODELAY IPTOS_LOWDELAY SO_RCVBUF=65536 SO_SNDBUF=65536
	read raw = yes
	write raw = yes
	max xmit = 65535
	strict allocate = no

[printers]
	path = /i-data/md0/.media/samba
	public = yes
	guest ok = yes
	browseable = yes
	writable = no
	printable = yes
	use client driver = yes

[public]
	path = /i-data/md0/public
	guest ok = yes
	follow symlinks = yes
; NO Action-log or Recycle-Bin

[video]
	path = /i-data/md0/video
	guest ok = yes
	follow symlinks = yes
; NO Action-log or Recycle-Bin

[photo]
	path = /i-data/md0/photo
	guest ok = yes
	follow symlinks = yes
; NO Action-log or Recycle-Bin

[music]
	path = /i-data/md0/music
	guest ok = yes
	follow symlinks = yes
; NO Action-log or Recycle-Bin

[admin]
	path = /i-data/md0/admin
	valid users = "admin"
	follow symlinks = yes
	vfs objects = full_audit
	 full_audit:prefix = %S
	 full_audit:success = unlink rmdir mkdir rename close
	 full_audit:failure = none
	 full_audit:priority = notice


[DISK_210]
	path = /var/autoshare_sata/DISK_210
	valid users = "admin"
	follow symlinks = yes
; NO Action-log or Recycle-Bin

