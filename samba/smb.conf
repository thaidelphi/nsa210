[global]
	workgroup = WORKGROUP
	server string = NSA210
	netbios name = nsa210
	dos charset = UTF8
	display charset = UTF8
	unix charset = UTF8
	security = user
	encrypt passwords = yes
	smb passwd file = /etc/samba/smbpasswd
	guest account = pc-guest
	map to guest = Bad User
	write ok = yes
	force create mode = 777
	force directory mode = 777
	force security mode = 777
	force directory security mode = 777
	auth methods = guest sam_ignoredomain
	max log size = 50
	host msdfs = yes
	use sendfile = yes
	strict allocate = no
	lanman auth = yes
	ntlm auth = yes
	client NTLMv2 auth = yes
	server signing = auto
	socket options = TCP_NODELAY IPTOS_LOWDELAY SO_RCVBUF=65536 SO_SNDBUF=65536
	read raw = yes
	write raw = yes
	max xmit = 65535

[download]
	comment = Transmission Downloads and Watch Folder
	path = /i-data/md0/admin/download
	public = yes
	guest ok = yes
	browseable = yes
	writable = yes
	force user = root
	force create mode = 777
	force directory mode = 777

[public]
	path = /i-data/md0/public
	guest ok = yes
	browseable = yes
	writable = yes
	follow symlinks = yes

[video]
	path = /i-data/md0/video
	guest ok = yes
	browseable = yes
	writable = yes
	follow symlinks = yes

[photo]
	path = /i-data/md0/photo
	guest ok = yes
	browseable = yes
	writable = yes
	follow symlinks = yes

[music]
	path = /i-data/md0/music
	guest ok = yes
	browseable = yes
	writable = yes
	follow symlinks = yes

[admin]
	path = /i-data/md0/admin
	valid users = "admin"
	browseable = yes
	writable = yes
	follow symlinks = yes
